<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jugend Forschungszentrum – Lightworkart Transfer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow-x: hidden; }
  body { 
    font-family: Arial, Helvetica, sans-serif; 
    background: #fff; 
    color: #000; 
    display: flex; 
    flex-direction: column; 
    position: relative;
  }
  
  /* Hintergrundbild mit 27% Deckkraft */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image: url('Lightworkart_ProS-12314.jpg');
    background-size: cover;
    background-position: center;
    opacity: 0.27;
    pointer-events: none;
    z-index: -2;
  }

  /* Blasen-Container im Hintergrund */
  .bubbles {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    overflow: hidden;
    pointer-events: none;
  }

  .bubble {
    position: absolute;
    bottom: -150px;
    background: rgba(255, 255, 255, 0.6);
    border: 2px solid rgba(0, 0, 0, 0.15);
    border-radius: 50%;
    animation: rise linear infinite;
  }

  @keyframes rise {
    0% {
      transform: translateY(0) scale(1);
      opacity: 0;
    }
    10% {
      opacity: 0.8;
    }
    90% {
      opacity: 0.8;
    }
    100% {
      transform: translateY(-110vh) scale(1);
      opacity: 0;
    }
  }

  .bubble.large {
    width: 70px;
    height: 70px;
    animation-duration: 9s;
  }
  .bubble.medium {
    width: 45px;
    height: 45px;
    animation-duration: 12s;
  }
  .bubble.small {
    width: 25px;
    height: 25px;
    animation-duration: 16s;
  }

  .bubble:nth-child(1) { left: 10%; animation-delay: 0s; }
  .bubble:nth-child(2) { left: 25%; animation-delay: 3s; }
  .bubble:nth-child(3) { left: 40%; animation-delay: 1.5s; }
  .bubble:nth-child(4) { left: 55%; animation-delay: 5s; }
  .bubble:nth-child(5) { left: 70%; animation-delay: 2.5s; }
  .bubble:nth-child(6) { left: 85%; animation-delay: 4s; }
  .bubble:nth-child(7) { left: 20%; animation-delay: 7s; }
  .bubble:nth-child(8) { left: 60%; animation-delay: 6s; }

  header { background: #000; height: 72px; display: flex; align-items: center; justify-content: center; gap: 8px; color: #fff; position: relative; z-index: 2; }
  header a { color: inherit; text-decoration: none; display: flex; align-items: baseline; gap: 8px; }
  header .brand { font-size: 24px; letter-spacing: .5px; }
  header .brand span { color: #e8832a; }
  header .sub { font-size: 11px; letter-spacing: .5px; }

  main { flex: 1; width: 100%; max-width: 520px; margin: 0 auto; padding: 30px 20px 40px; position: relative; z-index: 2; }
  .stack { position: relative; display: flex; flex-direction: column; gap: 12px; margin-left: 32px; }

  /* Zurück-Pfeil */
  .back { position: absolute; left: -52px; top: 34px; width: 26px; height: 46px; display: block; }
  .back::before { content: ""; position: absolute; inset: 0; background: #000; clip-path: polygon(100% 0, 0 50%, 100% 100%); }
  .back:focus-visible { outline: 3px solid #e8832a; outline-offset: 4px; }

  /* LINKS Überschrift */
  .links-title {
    text-align: center;
    font-size: 20px;
    font-weight: bold;
    letter-spacing: 1px;
    margin: 8px 0 4px 0;
  }

  /* Shake Animation */
  @keyframes shake {
    0% { transform: rotate(0deg); }
    20% { transform: rotate(-1.5deg); }
    40% { transform: rotate(1.5deg); }
    60% { transform: rotate(-1deg); }
    80% { transform: rotate(1deg); }
    100% { transform: rotate(0deg); }
  }

  .card-container { 
    border: 2px solid #000; 
    border-radius: 18px; 
    text-decoration: none; 
    color: #000; 
    display: flex; 
    align-items: center; 
    background: #fff; 
    justify-content: center; 
    min-height: 112px; 
    width: 100%;
    padding: 14px; 
    transition: transform 0.1s ease;
  }
  .card-container:hover {
    animation: shake 0.4s ease infinite;
  }
  .card-container img { max-width: 100%; max-height: 90px; height: auto; display: block; }

  .btn { 
    border: 2px solid #000; 
    border-radius: 18px; 
    text-decoration: none; 
    color: #000; 
    display: flex; 
    align-items: center; 
    background: #d9d9d9; 
    width: 82%; 
    height: 58px; 
    padding: 0 16px; 
    gap: 16px; 
    font-size: 14px; 
    transition: background .15s ease; 
  }
  .btn:hover { 
    background: #cbcbcb; 
    animation: shake 0.4s ease infinite;
  }
  .btn:focus-visible { outline: 3px solid #e8832a; outline-offset: 3px; }
  .btn svg, .btn img { width: 36px; height: 36px; flex-shrink: 0; object-fit: contain; }
  .btn .label { font-weight: bold; letter-spacing: .3px; font-size: 15px; }
  .btn.insta .label { font-size: 17px; font-weight: 600; }
  .btn.fb .label { font-size: 17px; font-weight: 700; color: #1877f2; }
  .btn.yt .label { font-size: 17px; font-weight: 700; }
  .btn.ki .label { font-size: 13px; font-weight: 600; }

  footer { text-align: center; padding: 24px 0 36px; font-size: 14px; position: relative; z-index: 2; }
  footer a { color: #000; margin: 0 10px; }

  @media (min-width: 700px) {
    main { padding-top: 38px; }
    .btn { width: 82%; }
  }
</style>
</head>
