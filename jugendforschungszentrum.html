<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jugend Forschungszentrum – Lightworkart Transfer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: Arial, Helvetica, sans-serif; background: #fff; color: #000; display: flex; flex-direction: column; }

  header { background: #000; height: 72px; display: flex; align-items: center; justify-content: center; gap: 8px; color: #fff; }
  header a { color: inherit; text-decoration: none; display: flex; align-items: baseline; gap: 8px; }
  header .brand { font-size: 24px; letter-spacing: .5px; }
  header .brand span { color: #e8832a; }
  header .sub { font-size: 11px; letter-spacing: .5px; }

  main { flex: 1; width: 100%; max-width: 520px; margin: 0 auto; padding: 44px 20px 40px; }
  .stack { position: relative; display: flex; flex-direction: column; gap: 10px; margin-left: 32px; }

  /* schwarzes Dreieck = zurück */
  .back { position: absolute; left: -52px; top: 34px; width: 26px; height: 46px; display: block; }
  .back::before { content: ""; position: absolute; inset: 0; background: #000; clip-path: polygon(100% 0, 0 50%, 100% 100%); }
  .back:focus-visible { outline: 3px solid #e8832a; outline-offset: 4px; }

  .card, .btn { border: 2px solid #000; border-radius: 18px; text-decoration: none; color: #000; display: flex; align-items: center; }
  .card { background: #fff; justify-content: center; min-height: 112px; padding: 14px; margin-bottom: 4px; }
  .card img { max-width: 100%; max-height: 90px; height: auto; display: block; }

  .btn { background: #d9d9d9; width: 82%; height: 58px; padding: 0 14px; gap: 18px; font-size: 14px; transition: background .15s; }
  .btn:hover { background: #cbcbcb; }
  .btn:focus-visible { outline: 3px solid #e8832a; outline-offset: 3px; }
  .btn svg { width: 40px; height: 40px; flex: none; }
  .btn .label { letter-spacing: .3px; }
  .btn.insta .label { font-size: 17px; font-weight: 600; letter-spacing: -.3px; }
  .btn.fb .label { font-size: 17px; font-weight: 700; color: #1877f2; letter-spacing: -.2px; margin-left: 6px; }

  footer { text-align: center; padding: 24px 0 36px; font-size: 14px; }
  footer a { color: #000; margin: 0 10px; }

  @media (min-width: 700px) {
    main { padding-top: 48px; }
    .btn { width: 82%; }
  }
</style>
</head>
<body>

<header>
  <a href="index.html" aria-label="Zur Startseite">
    <span class="brand">LIGHTWORK<span>ART</span></span>
    <span class="sub">TRANSFER</span>
  </a>
</header>

<main>
  <div class="stack">
    <!-- Zurück zur Startseite -->
    <a class="back" href="index.html" aria-label="Zurück zur Startseite"></a>

    <!-- Logo-Karte -->
    <div class="card">
      <img src="logo-jfz-600x214.png" alt="Jugend Forschungszentrum Schwarzwald-Schönbuch e.V.">
    </div>

    <!-- Homepage Link -->
    <a class="btn" href="https://www.jugendforschungszentrum.de/" target="_blank" rel="noopener">
      <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 4 2 21h6v15h9V25h6v11h9V21h6z" fill
