<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LIGHTWORKART Transfer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      font-family: "Helvetica Neue", Arial, sans-serif;
      background: #fff;
      color: #000;
    }
    header {
      background: #000;
      padding: 1.4rem 1rem;
      text-align: center;
    }
    .brand {
      color: #fff;
      font-size: 1.5rem;
      letter-spacing: .04em;
      font-weight: 300;
      white-space: nowrap;
    }
    .brand .art { color: #e8842c; }
    .brand small {
      font-size: .6rem;
      letter-spacing: .08em;
      margin-left: .4rem;
      vertical-align: baseline;
    }
    main {
      max-width: 480px;
      margin: 0 auto;
      padding: 3rem 1.25rem 4rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    .card {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 112px;
      padding: 1rem 1.5rem;
      border: 2px solid #000;
      border-radius: 22px;
      background: #fff;
      text-decoration: none;
    }
    .card img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .card.round img {
      height: 100%;
      width: auto;
      border-radius: 50%;
    }
    .card:focus-visible { outline: 3px solid #e8832a; outline-offset: 3px; }
    footer {
      text-align: center;
      font-size: .8rem;
      padding: 0 1rem 2rem;
    }
    footer a { color: #000; margin: 0 .6rem; }
  </style>
</head>
<body>

  <header>
    <div class="brand">LIGHTWORK<span class="art">ART</span><small>TRANSFER</small></div>
  </header>

  <main>
    <!-- 1. Jugendforschungszentrum (Verweist auf die Unterseite, z. B. jugendforschungszentrum.html oder jfz.html) -->
    <a class="card" href="jugendforschungszentrum.html">
      <img src="logo-jfz-600x214.png" alt="Jugend Forschungs Zentrum Schwarzwald-Schönbuch e.V.">
    </a>

    <!-- 2. Kreisfeuerwehrverband Calw -->
    <div class="card">
      <img src="logo-vorlage.svg" alt="Kreisfeuerwehrverband Calw">
    </div>

    <!-- 3. LIGHTWORKART -->
    <a class="card round" href="https://lightworkart.de" target="_blank" rel="noopener">
      <img src="260818_Lightworkart_Logo_Kreis.png" alt="LIGHTWORKART">
    </a>

    <!-- 4. Hi-Frame Design Studio -->
    <a class="card" href="https://www.hi-frame-design.de" target="_blank" rel="noopener">
      <img src="260408_HF_Design_Logo.png" alt="Hi Frame Design Studio">
    </a>
  </main>

  <footer>
    <a href="https://lightworkart.de/impressum/" target="_blank" rel="noopener">Impressum</a>
    <a href="https://lightworkart.de/datenschutz/" target="_blank" rel="noopener">Datenschutz</a>
  </footer>

</body>
</html>
